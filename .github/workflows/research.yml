# Weekly research loop: watch the official policy pages behind RULES.md,
# save a snapshot of each, and open an issue when one changes. If an
# ANTHROPIC_API_KEY secret exists, Claude also summarizes the change and,
# when a rule should change, opens a pull request revising RULES.md for you
# to review and merge.
name: Research loop

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays, 8:00 a.m. Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned)

      # Snapshots live on the research-snapshots branch, not main: main requires
      # the Registry check, which rejects direct pushes from this workflow.
      - name: Load the latest snapshots
        run: |
          if git ls-remote --exit-code --heads origin research-snapshots >/dev/null; then
            git fetch -q origin research-snapshots
            rm -rf research/snapshots
            git restore --source=FETCH_HEAD --worktree -- research/snapshots
            git restore --source=FETCH_HEAD --worktree -- research/failures.json 2>/dev/null || true
            echo "Loaded snapshots from research-snapshots."
          else
            echo "No research-snapshots branch yet; starting from main's snapshots."
          fi

      - name: Check watched sources
        id: watch
        run: |
          set +e
          python3 .github/scripts/research_watch.py
          code=$?
          if [ $code -eq 10 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; elif [ $code -ne 0 ]; then exit $code; fi

      - name: Show this run's results on the run page
        if: always()
        run: |
          { echo "## Research loop results"; if [ -s research/changes.md ]; then cat research/changes.md; else echo "No changes."; fi; } >> "$GITHUB_STEP_SUMMARY"

      - name: AI review (only if an ANTHROPIC_API_KEY secret is set)
        if: steps.watch.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://waterdamagegwinnett.com
        run: python3 .github/scripts/ai_review.py

      - name: Save snapshots to the research-snapshots branch
        run: |
          git config --global user.name "research-bot"
          git config --global user.email "research-bot@users.noreply.github.com"
          tmp="$(mktemp -d)/snap"
          if git ls-remote --exit-code --heads origin research-snapshots >/dev/null; then
            git fetch -q origin research-snapshots
            git worktree add -q "$tmp" FETCH_HEAD
          else
            git worktree add -q "$tmp" HEAD
          fi
          mkdir -p "$tmp/research"
          rm -rf "$tmp/research/snapshots"
          cp -r research/snapshots "$tmp/research/snapshots"
          [ -f research/failures.json ] && cp research/failures.json "$tmp/research/failures.json"
          cd "$tmp"
          git add -A research/snapshots
          [ -f research/failures.json ] && git add research/failures.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Research snapshots: $(date -u +%F)"
            git push -q origin HEAD:refs/heads/research-snapshots
            echo "Saved snapshots to research-snapshots."
          else
            echo "No snapshot changes."
          fi

      - name: Propose rule changes as a pull request
        id: pr
        if: steps.watch.outputs.changed == 'true' && hashFiles('RULES.proposed.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="rules-update-$(date -u +%Y%m%d)"
          mv RULES.proposed.md RULES.md
          git checkout -b "$branch"
          git add RULES.md
          git commit -m "Proposed RULES.md update from research loop ($(date -u +%F))"
          git push -u origin "$branch"
          { echo "Proposed by the weekly research loop. Review against the quoted sources before merging."; echo; cat research/ai_summary.md; } > pr_body.md
          url=$(gh pr create --title "Rules update: $(date -u +%F)" --body-file pr_body.md --base main --head "$branch") || {
            echo "::warning::Couldn't open a pull request. Turn on 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General. The proposed rules are on branch $branch."
            url="branch \`$branch\` (pull request couldn't be opened automatically)"
          }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Open an issue with what changed
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create research --color 1D76DB --description "Opened by the weekly research loop" --force >/dev/null
          {
            if [ -s research/ai_summary.md ]; then echo "## Summary"; cat research/ai_summary.md; echo; fi
            if [ -n "${{ steps.pr.outputs.url }}" ]; then echo "**Proposed rule changes:** ${{ steps.pr.outputs.url }}"; echo; fi
            echo "## What changed"; cat research/changes.md
          } > issue.md
          gh issue create --label research --title "Policy sources changed: $(date -u +%F)" --body-file issue.md

      - name: Flag sources that keep failing
        if: hashFiles('research/stuck.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s research/stuck.md ]; then
            gh label create research --color 1D76DB --description "Opened by the weekly research loop" --force >/dev/null
            { echo "These watched sources couldn't be checked three weeks running, so changes to them would be missed:"; echo; cat research/stuck.md; echo; echo "Replace the source in research/sources.json (or remove it), then close this issue."; } > stuck_issue.md
            gh issue create --label research --title "Research sources need attention: $(date -u +%F)" --body-file stuck_issue.md
          fi
