# Weekly research loop: watch the official policy pages behind RULES.md,
# save a snapshot of each, and open an issue when one changes. If an
# ANTHROPIC_API_KEY secret exists, Claude also summarizes the change and,
# when a rule should change, opens a pull request revising RULES.md for you
# to review and merge.
name: Research loop

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays, 8:00 a.m. Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check watched sources
        id: watch
        run: |
          set +e
          python3 .github/scripts/research_watch.py
          code=$?
          if [ $code -eq 10 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; elif [ $code -ne 0 ]; then exit $code; fi

      - name: AI review (only if an ANTHROPIC_API_KEY secret is set)
        if: steps.watch.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://waterdamagegwinnett.com
        run: python3 .github/scripts/ai_review.py

      - name: Save snapshots
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Research snapshots: $(date -u +%F)"
            git push
          fi

      - name: Propose rule changes as a pull request
        id: pr
        if: steps.watch.outputs.changed == 'true' && hashFiles('RULES.proposed.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="rules-update-$(date -u +%Y%m%d)"
          mv RULES.proposed.md RULES.md
          git checkout -b "$branch"
          git add RULES.md
          git commit -m "Proposed RULES.md update from research loop ($(date -u +%F))"
          git push -u origin "$branch"
          { echo "Proposed by the weekly research loop. Review against the quoted sources before merging."; echo; cat research/ai_summary.md; } > pr_body.md
          url=$(gh pr create --title "Rules update: $(date -u +%F)" --body-file pr_body.md --base main --head "$branch") || {
            echo "::warning::Couldn't open a pull request. Turn on 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General. The proposed rules are on branch $branch."
            url="branch \`$branch\` (pull request couldn't be opened automatically)"
          }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Open an issue with what changed
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create research --color 1D76DB --description "Opened by the weekly research loop" --force >/dev/null
          {
            if [ -s research/ai_summary.md ]; then echo "## Summary"; cat research/ai_summary.md; echo; fi
            if [ -n "${{ steps.pr.outputs.url }}" ]; then echo "**Proposed rule changes:** ${{ steps.pr.outputs.url }}"; echo; fi
            echo "## What changed"; cat research/changes.md
          } > issue.md
          gh issue create --label research --title "Policy sources changed: $(date -u +%F)" --body-file issue.md
