# Uploads the site to GoDaddy whenever main changes.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Use an FTP account whose directory is this site's document root.
# Only files this workflow uploaded are ever updated or removed on the
# server; anything else already there is left alone.
name: Deploy to GoDaddy

on:
  push:
    branches: [main]
    # Research snapshots, rules and workflow edits don't change the site
    paths-ignore:
      - "research/**"
      - "RULES.md"
      - "CLAUDE.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      protocol:
        description: "ftps = encrypted (preferred). ftp = plain, for testing the connection only."
        type: choice
        options: [ftps, ftp]
        default: ftps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Upload to the site folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: 21
          timeout: 60000
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            research/**
            RULES.md
            CLAUDE.md
            README.md
